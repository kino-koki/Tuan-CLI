[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuan-cli"
version = "0.3.1"
description = "青小团 Tuan-CLI — safety-first, model-agnostic, pure-Python AI Agent CLI (blast-radius preview → hard redline → exact /undo)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "agent", "cli", "code-agent", "terminal-agent", "safety", "blast-radius", "llm", "deepseek", "claude", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 注: 按 PEP 639, license 用下方 SPDX 表达式声明, 不再放 License :: 分类器
    # (新版 setuptools 会因二者并存而直接报错)。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # 核心运行依赖 (最小集): rich=终端 UI 输出 (ui/repl.py 模块级),
    # httpx=模型传输 (models/anthropic.py 模块级)。
    # pyyaml / prompt_toolkit 均有内置/裸输入降级路径, 见 optional-dependencies。
    "rich>=13.0",
    "httpx>=0.27",
    # Python < 3.11 无内置 tomllib, 旧版本回退用 tomli 解析 pyproject (迁移/探测场景)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# yaml: PyYAML 用于 YAML 配置/生态探测解析。不安装时 config/loader.py 自动降级
# 内置极简解析器, ecosystem 探测与 doctor 检查各自 try/except 兜底 (功能可用,
# 仅 YAML 高级语法/注释解析能力降级)。
yaml = ["pyyaml>=6.0"]
# repl: prompt_toolkit 增强交互 (补全/历史/快捷键)。不安装时 ui/repl.py 自动
# 降级为裸 input 输入 (功能可用, 无补全与行编辑增强)。
repl = ["prompt_toolkit>=3.0"]
# openai 仅作 OpenAI 兼容传输层使用, 核心逻辑 (路由/护栏/工具) 不依赖它。
# 使用本地/Ollama/Anthropic 等非 OpenAI 场景可不安装; 需要 OpenAI 兼容端点时再装。
openai = ["openai>=1.40"]
# crypto: AES-GCM 工业级认证加密 (替代纯 Python CTR+HMAC 回退)
# 不安装时 crypto 引擎自动回退 CTR+HMAC, 功能可用但非工业级。
crypto = ["cryptography>=41.0"]
# MCP 子系统仅在真正配置 MCP server 时解析配置 (kernel/mcp/config.py 惰性导入 pydantic),
# 故 pydantic/typing_extensions 放此处而非核心依赖; 用 MCP 时 `pip install ".[mcp]"`。
mcp = ["pydantic>=2.0", "typing_extensions>=4.0"]
# backend_dev 工具启动 FastAPI/Flask 开发服务器时才需要, 默认不安装。
backend = ["fastapi", "flask", "flask-cors", "uvicorn"]
# otel: OpenTelemetry 观测 (导出 traces/metrics 到标准 OTLP 后端)。不安装时
# ports/telemetry/otel.py 自动回退 stdlib urllib 直接 POST OTLP/HTTP JSON。
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/kino-koki/Tuan-CLI"
Repository = "https://github.com/kino-koki/Tuan-CLI"
Changelog = "https://github.com/kino-koki/Tuan-CLI/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/kino-koki/Tuan-CLI/issues"

[project.scripts]
tuan = "tuan_cli.cli:main"

[tool.setuptools.packages.find]
include = ["tuan_cli*"]

# 把内置技能模板与 SOUL.md 等资源文件打进 wheel (否则 pip install 后首次启动无技能)
[tool.setuptools.package-data]
tuan_cli = [
    "resources/**/*.md",
    "resources/**/*.yaml",
    "resources/**/*.yml",
    "resources/**/*.json",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true  # 逐步收紧: 先强制检查, 再要求所有函数有注解
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true  # 逐步收紧: 先不强制所有函数都有类型注解

# pytest 配置: slow marker 用于「真实 spawn 子进程 / 较重」的隔离验证测试,
# 默认跳过, 用 `pytest -m slow` 显式运行。
[tool.pytest.ini_options]
markers = [
    "slow: 真实 spawn 子进程或较重, 默认跳过 (pytest -m slow 运行)",
]
testpaths = ["tests"]
timeout = 120           # 每个测试最长 120s, 防挂起拖垮整套件
timeout_method = "thread"  # 默认用 thread 超时 (兼容 Windows); 挂起测试自动被中断

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuan-cli"
version = "0.3.1"
description = "青小团 Tuan-CLI — safety-first, model-agnostic, pure-Python AI Agent CLI (blast-radius preview → hard redline → exact /undo)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "agent", "cli", "code-agent", "terminal-agent", "safety", "blast-radius", "llm", "deepseek", "claude", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 注: 按 PEP 639, license 用下方 SPDX 表达式声明, 不再放 License :: 分类器
    # (新版 setuptools 会因二者并存而直接报错)。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # 核心运行依赖 (最小集): rich=终端 UI 输出 (ui/repl.py 模块级),
    # httpx=模型传输 (models/anthropic.py 模块级),
    # prompt_toolkit=默认 TUI (QxtTUI) 强依赖。它是 `tuan` 默认入口的必需品,
    # 缺失时进入交互界面会 NameError; 故提为核心依赖, 不再作为可选 extra,
    # 确保 `pip install tuan-cli` / `pip install -e .` / install.ps1 都自动带上它。
    "rich>=13.0",
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    # Python < 3.11 无内置 tomllib, 旧版本回退用 tomli 解析 pyproject (迁移/探测场景)
    "tomli>=2.0; python_version < '3.11'",
    # --- 以下原为可选 extra, 但实际属于「默认入口会用到」的必需依赖, 现提为核心 ---
    # 提为核心理由: 目标机「装完即用」不该再手工补装。用户反馈的「必须依赖全部直接
    # 放进包里面」即指这些 —— 它们不是锦上添花的可选能力, 而是缺了就会降级或报错。
    # yaml: config/loader.py 的 YAML 解析与 ecosystem 生态探测都走它; 不装会退到
    # 内置极简解析器, 用户的 config.yaml 语义被静默改写(注释/嵌套/多行失效)。
    "pyyaml>=6.0",
    # openai: OpenAI 兼容传输层; 绝大多数用户走的就是这条(且 model_lists 里
    # zhipu/sensenova/硅基流动等均为 OpenAI 兼容), 缺了等于主力路径不可用。
    "openai>=1.40",
    # pydantic: MCP 子系统配置模型 (kernel/mcp/config.py 惰性导入)。用户只要配了
    # 任一 MCP server 就会走到, 不装直接 MCP 不可用 —— 而 MCP 是默认能力之一。
    "pydantic>=2.0",
    "typing_extensions>=4.0",
    # cryptography: crypto 引擎的 AES-GCM 实现。默认走 CTR+HMAC 纯 Python 回退,
    # 但那是「功能可用、非工业级」; 加密存储属默认信任面, 按必需依赖随包分发。
    "cryptography>=41.0",
]

[project.optional-dependencies]
# 注: pyyaml / openai / prompt_toolkit / pydantic / typing_extensions /
# cryptography 已上移为**核心依赖**(见 [project.dependencies])—— 它们属于默认
# 入口会用到的必需能力, 不再作为可选 extra。下面只保留真正的「按需才装」。
# repl: prompt_toolkit 增强交互 (补全/历史/快捷键)。已随核心依赖安装, 此 extra
# 保留仅为兼容旧文档/脚本里的 `pip install ".[repl]"` 写法。
repl = ["prompt_toolkit>=3.0"]
# backend_dev 工具启动 FastAPI/Flask 开发服务器时才需要, 默认不安装。
backend = ["fastapi", "flask", "flask-cors", "uvicorn"]
# otel: OpenTelemetry 观测 (导出 traces/metrics 到标准 OTLP 后端)。不安装时
# ports/telemetry/otel.py 自动回退 stdlib urllib 直接 POST OTLP/HTTP JSON。
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/kino-koki/Tuan-CLI"
Repository = "https://github.com/kino-koki/Tuan-CLI"
Changelog = "https://github.com/kino-koki/Tuan-CLI/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/kino-koki/Tuan-CLI/issues"

[project.scripts]
tuan = "tuan_cli.cli:main"

[tool.setuptools.packages.find]
include = ["tuan_cli*"]

# 把内置技能模板与 SOUL.md 等资源文件打进 wheel (否则 pip install 后首次启动无技能)
[tool.setuptools.package-data]
tuan_cli = [
    "resources/**/*.md",
    "resources/**/*.yaml",
    "resources/**/*.yml",
    "resources/**/*.json",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true  # 逐步收紧: 先强制检查, 再要求所有函数有注解
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true  # 逐步收紧: 先不强制所有函数都有类型注解

# pytest 配置: slow marker 用于「真实 spawn 子进程 / 较重」的隔离验证测试,
# 默认跳过, 用 `pytest -m slow` 显式运行。
[tool.pytest.ini_options]
markers = [
    "slow: 真实 spawn 子进程或较重, 默认跳过 (pytest -m slow 运行)",
]
testpaths = ["tests"]
timeout = 120           # 每个测试最长 120s, 防挂起拖垮整套件
timeout_method = "thread"  # 默认用 thread 超时 (兼容 Windows); 挂起测试自动被中断

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuan-cli"
version = "0.3.3"
description = "青小团 Tuan-CLI — safety-first, model-agnostic, pure-Python AI Agent CLI (blast-radius preview → hard redline → exact /undo)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "agent", "cli", "code-agent", "terminal-agent", "safety", "blast-radius", "llm", "deepseek", "claude", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # 注: 按 PEP 639, license 用下方 SPDX 表达式声明, 不再放 License :: 分类器
    # (新版 setuptools 会因二者并存而直接报错)。
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # ── 核心运行依赖: 仅 2 个 ──
    # rich: 终端富文本输出 (ui/repl.py 模块级导入)。
    # prompt_toolkit: 默认 TUI 交互 (补全/历史/快捷键)。
    #
    # 其余历史依赖已全部由 tuan_cli 内部的零依赖实现替代, 且每一项都经过
    # 「在进程内屏蔽该第三方包、功能完整跑通」的实测验证, 因此不再声明为核心:
    #   httpx            → tuan_cli._http         (stdlib socket/ssl/http.client)
    #   openai           → tuan_cli._openai_sdk   (stdlib 传输 + SSE 解析)
    #   pydantic         → tuan_cli._config_model (判别联合校验 + 属性/dict 双形态)
    #   typing_extensions→ 已无任何调用点
    #   pyyaml           → tuan_cli._yaml         (stdlib 子集解析器, 与 PyYAML 差分一致)
    #   cryptography     → ext/crypto_engine.py   (PBKDF2 + CTR + HMAC 纯 Python)
    # 这样「核心依赖」重新回到它的诚实语义: 列在这里的, 缺了真的起不来。
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    # Python < 3.11 无内置 tomllib, 旧版本回退用 tomli 解析 TOML (迁移/探测场景)
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# 下面的 extra 都是「装了能力上限更高, 不装也完全能用」的增强项。
#
# 与旧版本的区别: 之前 pyyaml / openai / httpx / pydantic / cryptography 被写成
# 核心依赖, 但每一项内部都已经有 stdlib 兜底 —— 于是文档说「必须装」而实际上
# 不装也能跑, 属于双向误导。现在核心依赖只剩真正起不来的 2 个, 增强项归位到
# extra, 且每个都明确写清「不装时的行为」。
#
# yaml: PyYAML 完整 YAML 1.2 规范 (锚点/别名/标签/多文档)。不装时使用
# tuan_cli._yaml 的 stdlib 实现 —— 已对本仓库全部 YAML 文件做过差分测试,
# 解析结果与 PyYAML 完全一致; 遇到锚点等高级构造会抛出带行号的明确错误。
yaml = ["PyYAML>=6.0"]
# crypto: cryptography 的 AES-256-GCM (硬件加速、标准 AEAD)。不装时使用
# ext/crypto_engine.py 的 PBKDF2 + CTR + HMAC 纯 Python 实现, 功能等价。
crypto = ["cryptography>=41.0"]
# repl: prompt_toolkit 增强交互 (补全/历史/快捷键)。已随核心依赖安装, 此 extra
# 仅为兼容旧文档/脚本里的 `pip install ".[repl]"` 写法。
repl = ["prompt_toolkit>=3.0"]
# backend: backend_dev 工具启动 FastAPI/Flask 开发服务器时才需要, 默认不安装。
backend = ["fastapi", "flask", "flask-cors", "uvicorn"]
# otel: OpenTelemetry 观测 (导出 traces/metrics 到标准 OTLP 后端)。不安装时
# ports/telemetry/otel.py 自动回退 stdlib urllib 直接 POST OTLP/HTTP JSON。
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
# mcp: 保留空 extra 仅为兼容 `pip install -e ".[mcp]"` 的旧 CI 脚本与文档。
# tuan_cli 自研 MCP 客户端走 stdlib 的 asyncio + subprocess + json 实现
# JSON-RPC 2.0 over stdio; HTTP/SSE 传输用 tuan_cli._http, 配置校验用
# tuan_cli._config_model —— 整个 MCP 子系统零第三方依赖。
mcp = []
# browser: Browser Use 浏览器 agent 工具 (tools/browser.py 的 BrowserPlugin)。
# 纯可选 —— 未安装时工具 handler 一律返回安装指引 (INSTALL_HINT), 绝不炸 Agent 循环。
# 版本上限 <1.0: 0.x 大版本可能破坏, 限定在 0.x 线内; Chromium 另行 `uvx browser-use install`。
browser = ["browser-use>=0.1,<1.0"]
# dev: 测试与静态检查。openai / httpx / PyYAML 之所以在这里而不是核心依赖,
# 是因为测试代码拿它们当「真实 SDK 行为」的回归基准 (对照验证自研 shim),
# 运行期完全不需要。
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "mypy>=1.10",
    "openai>=1.40",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/kino-koki/Tuan-CLI"
Repository = "https://github.com/kino-koki/Tuan-CLI"
Changelog = "https://github.com/kino-koki/Tuan-CLI/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/kino-koki/Tuan-CLI/issues"

[project.scripts]
tuan = "tuan_cli.cli:main"

[tool.setuptools.packages.find]
include = ["tuan_cli*"]

# 把内置技能模板与 SOUL.md 等资源文件打进 wheel (否则 pip install 后首次启动无技能)
[tool.setuptools.package-data]
tuan_cli = [
    "resources/**/*.md",
    "resources/**/*.yaml",
    "resources/**/*.yml",
    "resources/**/*.json",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true  # 逐步收紧: 先强制检查, 再要求所有函数有注解
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true  # 逐步收紧: 先不强制所有函数都有类型注解

# pytest 配置: slow marker 用于「真实 spawn 子进程 / 较重」的隔离验证测试,
# 默认跳过, 用 `pytest -m slow` 显式运行。
[tool.pytest.ini_options]
markers = [
    "slow: 真实 spawn 子进程或较重, 默认跳过 (pytest -m slow 运行)",
    "flaky: 环境/时序敏感的间歇性测试 (残留临时文件、快照时间戳排序、单例替换), 失败不阻断回归",
]
testpaths = ["tests"]
timeout = 120           # 每个测试最长 120s, 防挂起拖垮整套件
timeout_method = "thread"  # 默认用 thread 超时 (兼容 Windows); 挂起测试自动被中断

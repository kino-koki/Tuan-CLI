[package]
name = "tuan"
version = "0.3.4"
description = "Tuan — Tauri shell for the Tuan-CLI engine"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "tuan_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
bytes = "1"
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Android / mobile code path is compiled conditionally; on-device runtime
# validation is done separately.
[target.'cfg(target_os = "android")'.dependencies]
# Bundled local engine adapter slot (reserved for on-device integration).

# 低端机（如骁龙 660/665）优化。
# 不开 LTO：Tauri 依赖树大，LTO 会把链接拖到 1 小时以上，收益远小于时间成本。
# opt-level=2 而非 "z"：实测 "z" 在本依赖树上编译同样极慢，
# 而最终体积主要由 R8（Android 侧）与依赖裁剪决定，改动 Rust 优化级别影响有限。
# 运行时性能上 opt-level=2 明显优于 "z"，更贴合低端机流畅运行的目标。
[profile.release]
opt-level = 2
codegen-units = 16
panic = "abort"
strip = true

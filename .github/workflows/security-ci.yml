name: Security CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # 每周一例行依赖漏洞扫描

jobs:
  supply-chain:
    name: Dependency & code security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      # 已知漏洞依赖扫描 (高危及以上阻断)
      # 注: pip-audit 无 --severity 参数; editable 安装的本包 (tuan-cli) 不在
      # PyPI 上, 需 --skip-editable 跳过, 否则审计直接报错退出。
      # 使用 python -m pip_audit 确保审计同一 Python 环境里已升级的 pip,
      # 避免 pip 自身 CVE (PYSEC-2026-*) 阻断门禁。
      - name: pip-audit (dependency CVE scan)
        run: |
          python -m pip install --upgrade pip
          python -m pip_audit --strict --skip-editable

      # 归因/许可/SBOM 一致性: NOTICE 引用的许可文件必须存在, SBOM 必须覆盖
      # requirements.lock 的全部顶层 pin (详见 scripts/check_licenses_sbom.py)。
      - name: License & SBOM consistency gate
        run: python scripts/check_licenses_sbom.py

      # 静态安全扫描 (排除测试目录)。B602 (shell=True) 由 scripts/check_shell_true.py
      # 白名单门禁单独裁决, 此处跳过避免双门禁口径冲突 (见 bandit.yaml)。
      # High 级问题已归零 (B324 弱哈希加 usedforsecurity=False, B602 走自有门禁);
      # 剩余 Medium/Low 为基线接受项 (B310 URL scheme / B604 shell=True 已门禁 /
      # B108 临时目录 / B608 SQL / B306 mktemp / B102 exec, 见 SECURITY_BASELINE)。
      # bandit 默认「有 finding 即 exit 1」与 -ll 报告阈值无关, 故用 --exit-zero
      # 只报告不阻断 —— 真正的阻断由专用门禁 (check_shell_true / mypy / tests) 负责。
      - name: bandit (static SAST)
        run: bandit -c bandit.yaml -r tuan_cli -x "*/tests/*,*/test_*.py" -ll -f txt --exit-zero

  harden-tests:
    name: Hardening module tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Hardening unit tests
        run: python -m pytest tests/test_harden_*.py -q

  safety-benchmarks:
    name: Safety benchmarks (reproducible numbers gate)
    runs-on: ubuntu-latest
    env:
      # 仓库根锚定: 基准脚本与存档都按 TUAN_REPO_ROOT 定位 (v0.3.1 起 _repo_root 首选此变量)
      TUAN_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run safety benchmarks (10k adversarial + 5k PowerShell + 2,497 bypass payloads)
        # 备份 git 存档后覆盖工作区汇总, 让 report 使用 CI 实跑数字。
        # 注意: 本 job 跑在 ubuntu-latest 上, 所以下面三套**确定性**基准 (钉死种子)
        # 实际是在 Linux 上执行的 —— 与 Windows 存档通过同一门禁, 本身就是跨平台验证。
        run: |
          cp bench/security-bench.json /tmp/security-bench.ref.json
          python -m tuan_cli safe bench --out bench/security-bench.json

      - name: Platform portability (POSIX/Linux/macOS payloads, 274 assertions)
        # 在本机 (Linux) 上跑 POSIX/Linux/macOS 载荷, 锁定检测层无平台相关逻辑。
        # 与 Windows 上的运行互为交叉验证: 两边数字都必须一致。
        run: python -m pytest tests/test_platform_portability.py -q

      - name: Gate — numbers must not regress vs committed archive
        run: |
          python - <<'EOF'
          import json

          new = json.load(open("bench/security-bench.json", encoding="utf-8"))
          ref = json.load(open("/tmp/security-bench.ref.json", encoding="utf-8"))
          problems = []

          adv_n, adv_r = new.get("adversarial") or {}, ref.get("adversarial") or {}
          if adv_n and adv_r:
              if adv_n.get("block_recall", 0) < adv_r.get("block_recall", 0) - 1e-9:
                  problems.append(f"adversarial block_recall {adv_n.get('block_recall')} < archive {adv_r.get('block_recall')}")
              if adv_n.get("bypass", 0) > adv_r.get("bypass", 0):
                  problems.append(f"adversarial bypass {adv_n.get('bypass')} > archive {adv_r.get('bypass')}")
              if adv_n.get("false_positive_rate", 0) > adv_r.get("false_positive_rate", 0) + 1.0:
                  problems.append(f"adversarial FP {adv_n.get('false_positive_rate')} > archive {adv_r.get('false_positive_rate')} + 1pt")

          ps_n, ps_r = new.get("powershell") or {}, ref.get("powershell") or {}
          if ps_n and ps_r:
              for k in ("fn", "fp"):
                  if ps_n.get(k, 0) > ps_r.get(k, 0):
                      problems.append(f"powershell {k} {ps_n.get(k)} > archive {ps_r.get(k)}")

          bm_n, bm_r = new.get("bypass_matrix") or {}, ref.get("bypass_matrix") or {}
          if bm_n and bm_r:
              if bm_n.get("bypass", 0) > bm_r.get("bypass", 0):
                  problems.append(f"bypass_matrix bypass {bm_n.get('bypass')} > archive {bm_r.get('bypass')}")
              if bm_r.get("all_disaster_blocked") and not bm_n.get("all_disaster_blocked"):
                  problems.append("bypass_matrix disaster classes no longer all blocked")

          if problems:
              print("REGRESSION DETECTED:")
              for p in problems:
                  print("  -", p)
              print("Fix the regression first; do not commit worse numbers over the archive.")
              raise SystemExit(1)
          print("Gate passed: numbers match or exceed committed archive")
          print(f"  adversarial: block_recall={adv_n.get('block_recall')}% fp={adv_n.get('false_positive_rate')}% bypass={adv_n.get('bypass')}")
          print(f"  powershell:  accuracy={ps_n.get('accuracy')} fn={ps_n.get('fn')} fp={ps_n.get('fp')}")
          print(f"  bypass:      bypass={bm_n.get('bypass')} disaster_all_blocked={bm_n.get('all_disaster_blocked')}")
          EOF

      - name: Generate shareable HTML security report
        run: python -m tuan_cli safe report --release --out security-report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.html
          if-no-files-found: error

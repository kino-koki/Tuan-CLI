name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp,openai]"

      - name: Syntax gate (py_compile)
        run: |
          python -m compileall -q qingxiaotuan
          python -m compileall -q tests

      # 版本政策强制 (docs/VERSION_POLICY.md):
      # 两处版本号必须一致、禁止回退、单次迭代增幅不得超过 +0.0.001。
      - name: Version policy gate
        run: python scripts/check_version_policy.py

      - name: Type check (mypy)
        run: python -m mypy qingxiaotuan

      - name: Test suite
        run: python -m pytest tests/ -q --timeout=120 --basetemp="$RUNNER_TEMP/pytest"

  # Windows 原生体验 (评审 Major #6): 单独矩阵跑跨平台纯 Python 测试子集
  # (TUI / 安全引擎 / 配置 / 内核 / 遥测 / 难度分类)。bash 与 POSIX 路径依赖的
  # 单测留在 ubuntu 矩阵, 避免在 Windows 上报假的噪音失败。
  windows:
    name: Windows · Python 3.12 · portable subset
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Syntax gate (py_compile)
        run: python -m compileall -q qingxiaotuan

      - name: Portable test subset
        shell: pwsh
        run: python -m pytest tests/test_tui_boot.py tests/test_config.py tests/test_config_schema.py tests/test_difficulty.py tests/test_router.py tests/test_hooks.py tests/test_hooks_events.py tests/test_kernel.py tests/test_kernel_emit_isolation.py tests/test_ports_telemetry.py tests/test_telemetry.py tests/test_safety_benign.py tests/test_safety_bypass_vectors.py tests/test_safety_confirm_and_alert.py tests/test_safety_redline_bypass.py tests/test_safety_redline_fix.py tests/test_security_v2.py tests/test_security_hardening.py -q --timeout=120

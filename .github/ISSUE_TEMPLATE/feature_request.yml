name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索现有 Issue 避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述你遇到的具体场景，而不是直接给方案——这有助于我们判断优先级
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望它怎么工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（如有）
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 与路线图，确认这不是重复建议
          required: true

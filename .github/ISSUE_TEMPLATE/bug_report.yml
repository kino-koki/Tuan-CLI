name: Bug 报告
description: 报告一个问题帮助我们改进
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索现有 Issue 避免重复。
        **注意：请勿在任何字段粘贴真实 API 密钥。**
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简明扼要地描述遇到了什么问题
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 'qxt ...'
        2. 输入 ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为正确的结果是什么
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`qxt doctor` 输出"
      description: 在终端运行 qxt doctor 并粘贴结果
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: "`qxt config dump` 输出（脱敏）"
      description: 请务必移除 api_key 等敏感字段后再粘贴
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "例如 3.12.4"
    validations:
      required: true
